[project]
name            = "c-compiler"
version         = "0.1.0"
description     = "A minimal C compiler written in Python"
readme          = "README.md"
requires-python = ">=3.13"
dependencies    = ["click>=8.4.2"]

[build-system]
requires      = ["uv_build"]
build-backend = "uv_build"

[project.scripts]
compiler = "compiler.compiler:compiler"

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "pre-commit>=4.6.0",
    "pyrefly>=1.0.0",
    "pytest>=9.0.3",
    "pytest-sugar>=1.1.1",
    "ruff>=0.15.11",
]

[tool]

[tool.pyrefly]
project-includes = ["compiler", "**/*.py*", "**/*.ipynb"]
project-excludes = ["**/__pycache__", "**/*venv/**", "**/.[!/.]*/**", "test"]
search-path = ["compiler"]
site-package-path = [
    ".venv/lib64/python3.13/site-packages",
    ".venv/lib/python3.13/site-packages",
]
use-ignore-files = true

[tool.ruff]
lint.select        = ["ANN", "E", "F", "W", "C", "I"]
lint.extend-select = ["ANN"]
lint.ignore        = []

# Allow ruff to auto fix any fixable issues
lint.fixable   = ["ALL"]
lint.unfixable = []
line-length    = 120

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.isort]

[tool.uv]
exclude-newer = "1 week"

[tool.uv.build-backend]
module-root = ""
module-name = "compiler"

[tool.pytest.ini_options]
testpaths = ["test"]
norecursedirs = ["compiler", ".venv", "**/__pycache__"]
addopts = "--ignore=compiler --import-mode=importlib"
markers = [
    "integration: full compile-and-run tests (require a system assembler/linker)",
]
